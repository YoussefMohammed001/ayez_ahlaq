name: ayez_ahlaq
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Internationalization
  intl: ^0.20.2

  # Networking client
  dio: ^5.8.0+1

  # Firebase core
  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0
  firebase_remote_config: ^6.1.3
  firebase_crashlytics: ^5.0.6

  # Local notifications
  flutter_local_notifications: ^19.1.0

  # State management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # Local storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.4

  # Dependency injection

  get_it: ^8.0.3

  # Functional programming


  # Responsive UI
  flutter_screenutil: ^5.9.3

  # UI and animation
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.1
  flutter_spinkit: ^5.2.1
  animate_do: ^4.2.0
  badges: ^3.1.2
  flutter_rating_bar: ^4.0.1
  floating_draggable_widget: ^2.3.0
  showcaseview: ^5.0.1

  # Media & files
  image_picker: ^1.1.2
  file_picker: ^10.1.2

  # Navigation
  go_router: ^14.8.1

  # Utilities
  url_launcher: ^6.3.1
  dartz: ^0.10.1       # Either
  crypto: ^3.0.6
  path: ^1.9.1
  http_parser: ^4.1.2
  connectivity_plus: ^7.0.0
  fluttertoast: ^8.2.4
  package_info_plus: ^8.3.0

  # Security & device
  safe_device: ^1.2.1
  permission_handler: ^12.0.0+1
  local_auth: ^2.3.0

  # Logging & debugging
  sentry_flutter: ^9.6.0
  pretty_dio_logger: ^1.4.0
  chucker_flutter: ^1.9.1


  # Forms & inputs
  pinput: ^5.0.1
  country_code_picker: ^3.4.1

  # Text helpers
  readmore: ^3.0.0

  # Splash screen
  flutter_native_splash: ^2.4.6

  # Code generation runtime
  json_annotation: ^4.9.0
  intl_utils: ^2.8.11
  dart_jsonwebtoken: ^3.3.1
  socket_io_client: ^3.1.3
  video_player: ^2.10.1
  chewie: ^1.13.0
  webview_flutter: ^4.13.1
  fl_chart: ^1.2.0
  device_info_plus: ^12.4.0
  confetti: ^0.8.0
  archive: any
  xml: any
  geocoding: ^4.0.0
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.2
  share_plus: ^12.0.2
dependency_overrides:
  shared_preferences_android: 2.4.10

dev_dependencies:
  # Testing
  flutter_test:
    sdk: flutter

  flutter_driver:
    sdk: flutter

  test:

  # Lints
  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.4.15
  json_serializable: ^6.11.1

flutter:
  uses-material-design: true

  # App assets
  assets:
    - assets/images/
    - assets/svg/
    - assets/fonts/

  # App fonts
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
    - family: ReemKufi
      fonts:
        - asset: assets/fonts/ReemKufi.ttf

flutter_intl:
  enabled: true